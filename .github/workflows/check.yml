name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 ruff check .
      - run: uv run --python 3.12 ruff format --check .
      - run: uv run --python 3.12 pytest
      - run: uv run --python 3.12 python -m topspin build --check
