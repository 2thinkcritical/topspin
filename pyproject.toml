[project]
name = "topspin"
version = "1.0.0"
description = "Ratings, charts and the standings page of the Topspin table tennis club's League of Roses."
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q", "--strict-markers", "--cov", "--cov-report=term-missing:skip-covered"]

[tool.coverage.run]
source = ["topspin"]
branch = true

[tool.coverage.report]
fail_under = 100
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
python_version = "3.11"
strict = true
files = ["topspin", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "PTH", "PIE", "RET", "TID"]
# Russian text in strings and comments is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]
