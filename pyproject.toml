[project]
name = "topspin"
version = "1.0.0"
description = "Ratings, charts and the standings page of the Topspin table tennis club's League of Roses."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]
# Russian text in strings and comments is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]
